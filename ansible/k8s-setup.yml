---
- name: Set up Kubernetes with Minikube
  hosts: all
  become: true
  vars:
    minikube_version: "latest"
    docker_users:
      - ubuntu

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip
          - unzip
          - jq
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

    - name: Ensure Docker service is enabled and started
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add users to docker group
      user:
        name: "{{ item }}"
        groups: docker
        append: yes
      loop: "{{ docker_users }}"

    - name: Fix Docker socket permissions
      file:
        path: /var/run/docker.sock
        mode: '0666'
      
    - name: Get latest stable kubectl version
      shell: curl -L -s https://dl.k8s.io/release/stable.txt
      register: kubectl_version
      changed_when: false

    - name: Download kubectl
      get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version.stdout }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'
        force: yes
      register: kubectl_download
      retries: 3
      delay: 5
      until: kubectl_download is succeeded

    - name: Download Minikube
      get_url:
        url: "https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64"
        dest: /usr/local/bin/minikube
        mode: '0755'
        force: yes
      register: minikube_download
      retries: 3
      delay: 5
      until: minikube_download is succeeded

    - name: Create Kubernetes config directory
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Verify Docker works for ubuntu user
      become_user: ubuntu
      shell: docker ps
      register: docker_test
      ignore_errors: yes

    - name: Start Minikube as root if user permissions fail
      shell: |
        minikube start --driver=docker --memory=2048 --cpus=2
      args:
        creates: /root/.minikube
      when: docker_test is failed
      ignore_errors: yes

    - name: Start Minikube as ubuntu user
      become_user: ubuntu
      shell: |
        docker ps && minikube start --driver=docker --memory=2048 --cpus=2
      args:
        creates: /home/ubuntu/.minikube
      environment:
        HOME: /home/ubuntu
      when: docker_test is succeeded
      ignore_errors: yes

    - name: Create k8s-manifests directory
      file:
        path: /home/ubuntu/k8s-manifests
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy frontend deployment manifest
      copy:
        dest: /home/ubuntu/k8s-manifests/frontend-deployment.yaml
        content: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: frontend
            labels:
              app: av-converter
              tier: frontend
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: av-converter
                tier: frontend
            template:
              metadata:
                labels:
                  app: av-converter
                  tier: frontend
              spec:
                containers:
                - name: frontend
                  image: av-converter-frontend:latest
                  imagePullPolicy: Never
                  ports:
                  - containerPort: 3000
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: frontend-service
            labels:
              app: av-converter
              tier: frontend
          spec:
            type: NodePort
            ports:
            - port: 80
              targetPort: 3000
              nodePort: 30080
            selector:
              app: av-converter
              tier: frontend
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Copy backend deployment manifest
      copy:
        dest: /home/ubuntu/k8s-manifests/backend-deployment.yaml
        content: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: backend
            labels:
              app: av-converter
              tier: backend
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: av-converter
                tier: backend
            template:
              metadata:
                labels:
                  app: av-converter
                  tier: backend
              spec:
                containers:
                - name: backend
                  image: av-converter-backend:latest
                  imagePullPolicy: Never
                  ports:
                  - containerPort: 5000
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: backend-service
            labels:
              app: av-converter
              tier: backend
          spec:
            type: ClusterIP
            ports:
            - port: 5000
              targetPort: 5000
            selector:
              app: av-converter
              tier: backend
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Create direct deployment script (without Kubernetes)
      copy:
        dest: /home/ubuntu/direct-deploy.sh
        content: |
          #!/bin/bash
          set -e

          echo "Cloning or updating repository..."
          cd ~
          if [ ! -d "video-to-audio-converter" ]; then
            git clone https://github.com/Dineshraja62005/AV-converter.git video-to-audio-converter
          else
            cd video-to-audio-converter
            git pull origin main
          fi

          cd ~/video-to-audio-converter/docker/dev

          echo "Deploying with Docker Compose directly..."
          sudo docker-compose down || true
          sudo docker-compose up -d --build

          # Open port 3001 in the firewall if needed
          sudo iptables -I INPUT -p tcp --dport 3001 -j ACCEPT

          echo "Application deployed successfully!"
          echo "Frontend URL: http://$(curl -s ifconfig.me):3001"
          
          # Show running containers
          echo "Running containers:"
          sudo docker ps
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Create Kubernetes application deployment script
      copy:
        dest: /home/ubuntu/k8s-deploy.sh
        content: |
          #!/bin/bash
          set -e

          echo "Cloning or updating repository..."
          cd ~
          if [ ! -d "video-to-audio-converter" ]; then
            git clone https://github.com/Dineshraja62005/AV-converter.git video-to-audio-converter
          else
            cd video-to-audio-converter
            git pull origin main
          fi

          cd ~/video-to-audio-converter/docker/dev

          echo "Building Docker images..."
          sudo docker build -t av-converter-frontend:latest -f ./frontend/Dockerfile .
          sudo docker build -t av-converter-backend:latest -f ./backend/Dockerfile .

          # Check if minikube is running
          if minikube status &>/dev/null; then
            # Make sure Minikube can use the images
            eval $(minikube docker-env)
            docker tag av-converter-frontend:latest av-converter-frontend:latest
            docker tag av-converter-backend:latest av-converter-backend:latest

            echo "Deploying to Kubernetes..."
            kubectl apply -f ~/k8s-manifests/

            echo "Waiting for pods to be ready..."
            kubectl wait --for=condition=ready pod -l app=av-converter --timeout=300s || true

            # For external access, create a tunnel in the background
            echo "Creating Minikube tunnel for external access..."
            nohup minikube tunnel > /dev/null 2>&1 &

            # Open port 30080 in the firewall if needed
            sudo iptables -I INPUT -p tcp --dport 30080 -j ACCEPT

            echo "Application deployed successfully on Kubernetes!"
            echo "Frontend URL: http://$(curl -s ifconfig.me):30080"
            
            # Show the pods and services
            echo "Deployed pods:"
            kubectl get pods
            
            echo "Deployed services:"
            kubectl get services
          else
            echo "Minikube is not running. Falling back to direct Docker Compose deployment..."
            ./direct-deploy.sh
          fi
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Create a simple deploy script (selects best method)
      copy:
        dest: /home/ubuntu/deploy-app.sh
        content: |
          #!/bin/bash
          
          # Check if minikube is working
          if minikube status &>/dev/null; then
            echo "Using Kubernetes deployment method..."
            ./k8s-deploy.sh
          else
            echo "Using Docker Compose deployment method..."
            ./direct-deploy.sh
          fi
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Install required Python packages
      pip:
        name:
          - kubernetes
          - openshift
        state: present
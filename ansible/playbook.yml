---
- name: Configure AV Converter EC2
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    app_dir: /home/ubuntu/video-to-audio-converter
    repo_url: https://github.com/Dineshraja62005/AV-converter.git
    branch: main

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - docker.io
          - python3-pip
          - git
          - python3-docker
        state: present

    - name: Install Docker Compose
      get_url:
        url: https://github.com/docker/compose/releases/download/v2.23.3/docker-compose-linux-x86_64
        dest: /usr/local/bin/docker-compose
        mode: '0755'
        force: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create app directory if it doesn't exist
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Clone or update AV Converter repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ branch }}"
        force: yes
      become_user: ubuntu

    - name: Set permissions on app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'
        recurse: yes

    - name: Create docker-compose directory if it doesn't exist
      file:
        path: "{{ app_dir }}/docker/dev"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'
      become_user: ubuntu

    - name: Deploy Docker Compose services
      shell: |
        cd {{ app_dir }}/docker/dev
        docker compose down --remove-orphans
        docker compose up -d --build
      become_user: ubuntu

    - name: Check if Docker Compose services are running
      shell: docker ps
      register: docker_ps_result
      become_user: ubuntu

    - name: Display running containers
      debug:
        var: docker_ps_result.stdout_lines
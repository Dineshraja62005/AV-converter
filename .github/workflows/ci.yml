name: Terraform, Ansible, and Kubernetes Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Setup SSH for Terraform and Ansible
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      # Initialize Terraform
      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      # Apply Terraform configuration
      - name: Terraform Apply
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve \
            -var="aws_access_key=${{ secrets.AWS_ACCESS_KEY_ID }}" \
            -var="aws_secret_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            -var="aws_session_token=${{ secrets.AWS_SESSION_TOKEN }}" \
            -var="key_name=${{ secrets.KEY_NAME }}" \
            -var="private_key_path=~/.ssh/id_rsa"
      
      # Extract EC2 instance IP and store in output
      - name: Get EC2 Instance IP
        id: get-ip
        working-directory: ./terraform
        run: |
          EC2_IP=$(terraform output -raw public_ip)
          echo "ec2_ip=$EC2_IP" >> $GITHUB_OUTPUT
          echo "EC2 Instance IP: $EC2_IP"
          echo "Kubernetes URL: http://$EC2_IP:30080"

      # Update EC2_HOST secret using GitHub API
      - name: Update EC2_HOST secret
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EC2_IP: ${{ steps.get-ip.outputs.ec2_ip }}
        run: |
          # Create a temporary file with the new secret value
          echo -n "$EC2_IP" > ec2_host_value.txt
          
          # Get the existing secret to get its ID
          SECRET_INFO=$(gh api \
            repos/$REPO/actions/secrets/EC2_HOST 2>/dev/null || echo '{"key_id":""}')
          
          # Get the public key for secret encryption
          KEY_INFO=$(gh api repos/$REPO/actions/secrets/public-key)
          KEY_ID=$(echo $KEY_INFO | jq -r .key_id)
          PUBLIC_KEY=$(echo $KEY_INFO | jq -r .key)
          
          # Install sodium_cli for encryption
          sudo apt-get update && sudo apt-get install -y libsodium-dev
          pip install sodium-cli
          
          # Encrypt the secret value
          ENCRYPTED_VALUE=$(sodium-cli encrypt --public-key "$PUBLIC_KEY" --file ec2_host_value.txt | base64)
          
          # Update the secret
          gh api \
            --method PUT \
            repos/$REPO/actions/secrets/EC2_HOST \
            -f encrypted_value="$ENCRYPTED_VALUE" \
            -f key_id="$KEY_ID"
            
          echo "Updated EC2_HOST secret with new IP address: $EC2_IP"
          rm ec2_host_value.txt

      # Install Ansible
      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

      # Wait for the instance to be ready
      - name: Wait for instance to be ready
        run: |
          echo "Waiting for instance to be ready..."
          timeout 300 bash -c 'until ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@${{ steps.get-ip.outputs.ec2_ip }} "echo Instance ready"; do sleep 5; done'

      # Run Ansible playbook
      - name: Run Ansible playbook
        run: |
          export ANSIBLE_HOST_KEY_CHECKING=False
          ansible-playbook -i ansible/inventory.ini ansible/k8s-setup.yml -v

      # Deploy application using SSH
      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ steps.get-ip.outputs.ec2_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "Running application deployment script..."
            ~/deploy-app.sh
            
            echo "=============================="
            echo "Deployment complete!"
            echo "Access your application at:"
            echo "http://${{ steps.get-ip.outputs.ec2_ip }}:30080"
            echo "=============================="
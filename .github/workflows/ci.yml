name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to AWS EC2 via Terraform & Ansible
    runs-on: ubuntu-latest

    env:
      TF_VAR_ec2_host: ${{ secrets.EC2_HOST }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      - name: 🔐 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: 🧱 Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: 🌍 Terraform Init & Apply
        working-directory: infra
        run: |
          terraform init
          terraform apply -auto-approve \
            -var="aws_access_key=${{ secrets.AWS_ACCESS_KEY_ID }}" \
            -var="aws_secret_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            -var="aws_session_token=${{ secrets.AWS_SESSION_TOKEN }}" \
            -var="key_name=${{ secrets.KEY_NAME }}" \
            -var="private_key_path=~/.ssh/id_rsa" \
            -var="ec2_host=${{ secrets.EC2_HOST }}"

      - name: ⚙️ Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: 📦 Run Ansible Playbook for Full Deployment
        run: |
          echo "${{ secrets.EC2_HOST }} ansible_user=${{ secrets.EC2_USER }} ansible_ssh_private_key_file=~/.ssh/id_rsa" > inventory.ini
          ansible-playbook -i inventory.ini ansible/playbook.yml \
            -e "ansible_ssh_common_args='-o StrictHostKeyChecking=no'"
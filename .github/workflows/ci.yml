name: Terraform, Ansible, and Kubernetes Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Setup SSH for Terraform and Ansible
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      # Initialize Terraform
      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      # Apply Terraform configuration
      - name: Terraform Apply
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve \
            -var="aws_access_key=${{ secrets.AWS_ACCESS_KEY_ID }}" \
            -var="aws_secret_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            -var="aws_session_token=${{ secrets.AWS_SESSION_TOKEN }}" \
            -var="key_name=${{ secrets.KEY_NAME }}" \
            -var="private_key_path=~/.ssh/id_rsa"
      
      # Extract EC2 instance IP - FIXED
      - name: Get EC2 Instance IP
        id: get-ip
        working-directory: ./terraform
        run: |
          # Capture raw output for debugging
          RAW_OUTPUT=$(terraform output -raw public_ip)
          echo "Raw Terraform output: '$RAW_OUTPUT'"
          
          # Extract just the first IP pattern found
          if [[ $RAW_OUTPUT =~ ([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}) ]]; then
            EC2_IP=${BASH_REMATCH[1]}
            echo "Extracted IP: $EC2_IP"
            echo "ec2_ip=$EC2_IP" >> $GITHUB_OUTPUT
            
            echo "============================================================"
            echo "IMPORTANT: Update your EC2_HOST secret manually with this IP"
            echo "EC2_HOST = $EC2_IP"
            echo "============================================================"
          else
            echo "Could not extract valid IP from Terraform output. Using raw output as fallback."
            EC2_IP=$(echo "$RAW_OUTPUT" | head -n1 | tr -d '[:space:]')
            echo "Fallback IP: $EC2_IP"
            echo "ec2_ip=$EC2_IP" >> $GITHUB_OUTPUT
          fi
          
          echo "EC2 Instance IP: $EC2_IP"
          echo "Kubernetes URL: http://$EC2_IP:30080"

      # Install Ansible
      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

      # Wait for the instance to be ready
      - name: Wait for instance to be ready
        run: |
          echo "Waiting for instance to be ready..."
          timeout 300 bash -c 'until ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@${{ steps.get-ip.outputs.ec2_ip }} "echo Instance ready"; do sleep 5; done'

      # Run Ansible playbook
      - name: Run Ansible playbook
        run: |
          export ANSIBLE_HOST_KEY_CHECKING=False
          ansible-playbook -i ansible/inventory.ini ansible/k8s-setup.yml -v

      # Deploy application using SSH
      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ steps.get-ip.outputs.ec2_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "Running application deployment script..."
            ~/deploy-app.sh
            
            echo "=============================="
            echo "Deployment complete!"
            echo "Access your application at:"
            echo "http://${{ steps.get-ip.outputs.ec2_ip }}:30080"
            echo "=============================="

      # Final deployment information
      - name: Deployment Information
        run: |
          echo "============================================================"
          echo "🚀 DEPLOYMENT SUCCESSFUL!"
          echo "📝 Please update these secrets for your next run:"
          echo "   EC2_HOST = ${{ steps.get-ip.outputs.ec2_ip }}"
          echo "📊 Access your application at:"
          echo "   http://${{ steps.get-ip.outputs.ec2_ip }}:30080"
          echo "============================================================"
          
name: CI/CD Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  deploy:
    name: Deploy to AWS EC2 via AWS SSM
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
          
      - name: Deploy using AWS SSM Run Command
        run: |
          # Get instance ID using the public IP
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=ip-address,Values=${{ secrets.EC2_HOST }}" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)
            
          if [ -z "$INSTANCE_ID" ]; then
            echo "Could not find EC2 instance with IP ${{ secrets.EC2_HOST }}"
            exit 1
          fi
          
          echo "Found EC2 instance: $INSTANCE_ID"
          
          # Create deployment script
          cat > deploy.sh << 'EOL'
          #!/bin/bash
          set -e
          sudo apt update
          sudo apt install -y docker.io docker-compose git
          cd ~
          if [ ! -d "video-to-audio-converter" ]; then
            git clone https://github.com/Dineshraja62005/AV-converter.git video-to-audio-converter
          else
            cd video-to-audio-converter
            git pull origin main
          fi
          cd ~/video-to-audio-converter/docker/dev
          sudo docker-compose down
          sudo docker-compose up -d --build
          EOL
          
          # Execute deployment using SSM
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[$(cat deploy.sh | jq -Rs .)]" \
            --comment "Deploy AV Converter application" \
            --output text
            
          echo "Deployment command sent to EC2 instance"
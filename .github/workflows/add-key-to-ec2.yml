name: Add SSH Key to EC2

on:
  workflow_dispatch:

jobs:
  add-key:
    name: Add SSH Key to EC2 Instance
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
          
      - name: Create SSH key
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keygen -y -f ~/.ssh/key.pem > ~/.ssh/key.pub
          echo "Public key content:"
          cat ~/.ssh/key.pub
          
      - name: Add key to EC2 authorized_keys
        run: |
          # Get instance ID using the public IP
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=ip-address,Values=${{ secrets.EC2_HOST }}" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)
            
          if [ -z "$INSTANCE_ID" ]; then
            echo "Could not find EC2 instance with IP ${{ secrets.EC2_HOST }}"
            exit 1
          fi
          
          echo "Found EC2 instance: $INSTANCE_ID"
          
          # Extract public key
          PUBLIC_KEY=$(cat ~/.ssh/key.pub)
          
          # Create script to add the key
          cat > add_key.sh << EOL
          #!/bin/bash
          USER_HOME=\$(eval echo ~\$USER)
          mkdir -p \$USER_HOME/.ssh
          chmod 700 \$USER_HOME/.ssh
          echo "$PUBLIC_KEY" >> \$USER_HOME/.ssh/authorized_keys
          chmod 600 \$USER_HOME/.ssh/authorized_keys
          echo "Key added successfully"
          EOL
          
          # Execute using SSM
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[$(cat add_key.sh | jq -Rs .)]" \
            --comment "Add SSH key to authorized_keys" \
            --output text
            
          echo "Command sent to add key to EC2 instance"
          